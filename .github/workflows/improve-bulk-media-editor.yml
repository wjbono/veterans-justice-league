name: One-time bulk media editor UX improvement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bulk media editor improvement
        run: python .github/scripts/improve_bulk_media_editor.py
      - name: Validate changed files
        run: |
          node --check assets/js/admin.js
          grep -q 'Bulk edit selected' admin/index.html
          grep -q 'data-bulk-workflow-actions' admin/index.html
      - name: Commit improved bulk editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve bulk media editor UX"
          git push
