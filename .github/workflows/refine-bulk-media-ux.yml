name: One-time bulk media UX refinement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX refinement
        run: python scripts/refine_bulk_ux.py
      - name: Validate JavaScript
        run: node --check assets/js/admin.js
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-bulk-media-ux.yml scripts/refine_bulk_ux.py
          git add admin/index.html assets/js/admin.js assets/css/admin.css
          git commit -m "Refine bulk media editing UX"
          git push
