name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact VJL logo
        run: |
          cat .build-assets/vjl-exact-00.b64 \
              .build-assets/vjl-exact-01.b64 \
              .build-assets/vjl-exact-02.b64 \
              .build-assets/vjl-exact-03.b64 \
              .build-assets/vjl-exact-04.b64 \
              .build-assets/vjl-exact-05.b64 \
              .build-assets/vjl-exact-06.b64 \
              .build-assets/vjl-exact-07.b64 \
              .build-assets/vjl-exact-08.b64 \
              .build-assets/vjl-exact-09.b64 \
              .build-assets/vjl-exact-10.b64 | base64 -d > assets/images/vjl-logo.png
          test "$(wc -c < assets/images/vjl-logo.png)" -eq 32857
          echo "259d6163ff0a2887217a2fd300448aef381fb85cc7df4e479f43738f983b7956  assets/images/vjl-logo.png" | sha256sum -c -
          rm -rf .build-assets
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/config.js
          node --check assets/js/home-media.js
          node --check assets/js/gallery.js
          node --check assets/js/admin-auth.js
          node --check assets/js/admin.js
          node --check assets/js/admin-upload.js
          node --check assets/js/admin-users.js
          node --check worker/src/media-policy.js
          node --check worker/src/derivative-policy.js
          node --check worker/src/exif-date.js
          node --check worker/src/index.js
          node --check worker/src/main.js
          node --check worker/tests/media-policy.test.mjs
          node --check worker/tests/derivative-policy.test.mjs
          node --check worker/tests/exif-date.test.mjs
      - name: Test Worker media policies
        run: |
          node worker/tests/media-policy.test.mjs
          node worker/tests/derivative-policy.test.mjs
          node worker/tests/exif-date.test.mjs
      - name: Prepare production assets
        run: python3 .github/scripts/prepare_assets.py
      - name: Prepare static launch metadata
        run: python3 .github/scripts/prepare_site.py
      - name: Validate production cleanliness
        run: python3 .github/scripts/validate_cleanliness.py
      - name: Validate static site
        run: python3 .github/scripts/validate_site.py
      - name: Assemble publishable site artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp ./*.html _site/
          cp robots.txt sitemap.xml .nojekyll _site/
          cp -R assets admin _site/
          find _site -type f \( -name '.gitkeep' -o -name '*.b64' -o -name '*.bak' -o -name '*.tmp' \) -delete
          test -f _site/index.html
          test -f _site/assets/images/vjl-logo.png
          test -f _site/admin/index.html
          test -f _site/admin/users.html
          test ! -e _site/BACKLOG.md
          test ! -e _site/README.md
          test ! -e _site/LAUNCH_RUNBOOK.md
          test ! -e _site/worker
          test ! -e _site/.github
          test -z "$(find _site -type f \( -name '.gitkeep' -o -name '*.b64' -o -name '*.bak' -o -name '*.tmp' \) -print -quit)"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed Pages site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          for path in \
            '' \
            'about.html' \
            'programs.html' \
            'housing.html' \
            'behind-the-wall.html' \
            'outreach.html' \
            'gallery.html' \
            'events.html' \
            'contact.html' \
            'team.html' \
            'admin/' \
            'admin/users.html' \
            'assets/css/styles.css' \
            'assets/css/gallery.css' \
            'assets/css/admin.css' \
            'assets/js/site.js' \
            'assets/js/home-media.js' \
            'assets/js/gallery.js' \
            'assets/js/admin-auth.js' \
            'assets/js/admin.js' \
            'assets/js/admin-upload.js' \
            'assets/js/admin-users.js' \
            'assets/images/vjl-logo.png'; do
            echo "Checking ${base}${path}"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --output /dev/null "${base}${path}"
          done
          missing="${base}__vjl_pages_smoke_missing__.html"
          code="$(curl --silent --show-error --location --output /tmp/vjl-404.html --write-out '%{http_code}' "$missing")"
          test "$code" = '404'
          grep -q 'Page Not Found' /tmp/vjl-404.html
      - name: Render deployed site in headless Chrome
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          base="${PAGE_URL%/}/"
          mkdir -p /tmp/vjl-browser-qc
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --dump-dom "${base}" > /tmp/vjl-browser-qc/home-dom.html
          grep -q 'Support, Housing &amp; Advocacy' /tmp/vjl-browser-qc/home-dom.html
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --dump-dom "${base}gallery.html" > /tmp/vjl-browser-qc/gallery-dom.html
          grep -q 'VJL Housing' /tmp/vjl-browser-qc/gallery-dom.html
          grep -q 'Behind-the-Wall Training' /tmp/vjl-browser-qc/gallery-dom.html
          grep -q 'Outreach' /tmp/vjl-browser-qc/gallery-dom.html
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,1200 --screenshot=/tmp/vjl-browser-qc/desktop-home.png "${base}"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,1200 --screenshot=/tmp/vjl-browser-qc/desktop-gallery.png "${base}gallery.html"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,844 --screenshot=/tmp/vjl-browser-qc/mobile-home.png "${base}"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,844 --screenshot=/tmp/vjl-browser-qc/mobile-gallery.png "${base}gallery.html"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,844 --screenshot=/tmp/vjl-browser-qc/mobile-contact.png "${base}contact.html"
      - name: Upload browser QC screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qc-${{ github.run_number }}
          path: /tmp/vjl-browser-qc/*.png
          retention-days: 1
          if-no-files-found: ignore
