name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact VJL logo
        run: |
          cat .build-assets/logo-b64-00.txt \
              .build-assets/logo-b64-01.txt \
              .build-assets/logo-b64-02.txt \
              .build-assets/logo-b64-03.txt \
              .build-assets/logo-b64-04.txt \
              .build-assets/logo-b64-05.txt \
              .build-assets/logo-b64-06.txt | base64 -d > assets/images/vjl-logo.png
          test "$(wc -c < assets/images/vjl-logo.png)" -eq 32857
          echo "259d6163ff0a2887217a2fd300448aef381fb85cc7df4e479f43738f983b7956  assets/images/vjl-logo.png" | sha256sum -c -
          rm -rf .build-assets
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
